name: Sentinel package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'twentylines/orbis-sentinel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      filename: ${{ steps.package.outputs.filename }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Prepare package workspace
        shell: bash
        run: |
          mkdir -m 700 sentinel-package-work
          mkdir -m 700 sentinel-package-work/tmp
      - name: Test
        env:
          TMPDIR: ${{ github.workspace }}/sentinel-package-work/tmp
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_capture_page.mjs tests/test_attest_package.mjs
      - name: Build and qualify package
        id: package
        env:
          TMPDIR: ${{ github.workspace }}/sentinel-package-work/tmp
        shell: bash
        run: |
          python packaging/qualify_release.py --output sentinel-package-work/package > sentinel-package-work/result.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('sentinel-package-work/result.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('artifact', 'checksum', 'filename', 'sha256', 'version'):
                  output.write(f'{key}={result[key]}\n')
          PY
      - name: Fetch pinned signing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: actions/attest
          ref: 1e69f48acb82d1966a394da916b4c1698aa569d6
          path: sentinel-package-work/tools/attest
          persist-credentials: false
      - name: Check package temporary directory
        env:
          TMPDIR: ${{ github.workspace }}/sentinel-package-work/tmp
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          path = Path(os.environ['TMPDIR']).resolve(strict=True)
          assert path.is_relative_to(root)
          PY
      - name: Attest qualified archive
        id: attestation
        uses: ./.github/actions/attest-package
        env:
          TMPDIR: ${{ github.workspace }}/sentinel-package-work/tmp
        with:
          subject-name: ${{ steps.package.outputs.filename }}
          subject-digest: sha256:${{ steps.package.outputs.sha256 }}
      - name: Verify signed publisher before artifact upload
        env:
          TMPDIR: ${{ github.workspace }}/sentinel-package-work/tmp
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          SIGNED_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          bundle = Path(os.environ['SIGNED_BUNDLE']).resolve(strict=True)
          assert bundle.is_relative_to(root), 'Signing bundle must remain inside the workspace'
          PY
          mkdir -m 755 sentinel-package-work/publisher-staged
          python packaging/verify_release.py \
            --artifact "$ARTIFACT" \
            --bundle "$SIGNED_BUNDLE" \
            --releases "$GITHUB_WORKSPACE/sentinel-package-work/publisher-staged" \
            --workspace "$GITHUB_WORKSPACE/sentinel-package-work/publisher-verification" \
            --sha256 "$RELEASE_SHA256" \
            --version "$RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --verifier "$(command -v gh)"
      - name: Retain the verified public provenance bundle
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          artifact = Path(os.environ['ARTIFACT'])
          verified = Path('sentinel-package-work/publisher-verification/inputs') / ('orbis-sentinel-' + os.environ['RELEASE_VERSION'] + '.tar.gz.sigstore.json')
          body = verified.read_bytes()
          assert 0 < len(body) <= 4 * 1024 * 1024
          target = artifact.with_name(artifact.name + '.sigstore.json')
          with target.open('xb') as output:
              output.write(body)
          PY
      - name: Upload qualified archive, checksum and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-package-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.artifact }}.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  native-systemd:
    needs: package
    if: github.repository == 'twentylines/orbis-sentinel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact qualified package
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ github.workspace }}/sentinel-native-tmp
          XDG_CACHE_HOME: ${{ github.workspace }}/sentinel-native-cache
        run: |
          mkdir -m 700 sentinel-native-tmp sentinel-native-cache
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "sentinel-package-$GITHUB_SHA" --dir "$GITHUB_WORKSPACE/sentinel-native-input"
      - name: Qualify real installed systemd activation and rollback
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SHA256: ${{ needs.package.outputs.sha256 }}
          RELEASE_FILENAME: ${{ needs.package.outputs.filename }}
          TMPDIR: ${{ github.workspace }}/sentinel-native-tmp
        run: |
          sudo -n /usr/bin/python3 -I -B tests/qualify_systemd.py \
            --source "$GITHUB_WORKSPACE" --work "$GITHUB_WORKSPACE/sentinel-native-work" \
            --artifact "$GITHUB_WORKSPACE/sentinel-native-input/$RELEASE_FILENAME" \
            --bundle "$GITHUB_WORKSPACE/sentinel-native-input/$RELEASE_FILENAME.sigstore.json" \
            --sha256 "$RELEASE_SHA256" --version "$RELEASE_VERSION" --source-commit "$GITHUB_SHA"
