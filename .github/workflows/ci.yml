name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          TMPDIR="$(mktemp -d "${GITHUB_WORKSPACE:?}/.sentinel-tests.XXXXXX")"
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          python -m unittest discover -s tests -v
