name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  capture-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - name: Test capture page
        run: node --test tests/test_capture_page.mjs tests/test_recovery_page.mjs
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the pinned Core credential fence contract
        env:
          CORE_CONTRACT_COMMIT: ebafc0977a2421e57ebd1ce0cbf81813ff3f90d5
        shell: bash
        run: |
          python3 - <<'PYCORE'
          import hashlib, os, pathlib, urllib.request
          commit = os.environ['CORE_CONTRACT_COMMIT']
          filenames = (
              'orbis-host-credential-fence.py',
              'test_orbis_host_credential_fence_contract.py',
          )
          sha256 = (
              '687750c070190bb756555c09a040cd3a7468d6b8abd2511a1ec8827fe329f985',
              '22496f85ac42c37307667db97834950f89ab9bd42d96bd0f22a203ac22889a16',
          )
          destination = pathlib.Path('core-contract/scripts')
          destination.mkdir(parents=True)
          for name, expected in zip(filenames, sha256):
              url = f'https://raw.githubusercontent.com/twentylines/orbis/{commit}/scripts/{name}'
              with urllib.request.urlopen(url, timeout=30) as source:
                  body = source.read(65537)
              if len(body) > 65536 or hashlib.sha256(body).hexdigest() != expected:
                  raise SystemExit(f'Core contract digest mismatch: {name}')
              (destination / name).write_bytes(body)
          PYCORE
          python3 -B core-contract/scripts/test_orbis_host_credential_fence_contract.py -v
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        env:
          ORBIS_RECOVERY_TEST_CORE: ${{ github.workspace }}/core-contract
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          TMPDIR="$(mktemp -d "${GITHUB_WORKSPACE:?}/.t.XXXXXX")"
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          python -m unittest discover -s tests -v
