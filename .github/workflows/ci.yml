name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  capture-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - name: Test capture page
        run: node --test tests/test_capture_page.mjs tests/test_recovery_page.mjs
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Check out the Core credential fence contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: twentylines/orbis
          ref: ebafc0977a2421e57ebd1ce0cbf81813ff3f90d5
          path: core-contract
          sparse-checkout: scripts/orbis-host-credential-fence.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        env:
          ORBIS_RECOVERY_TEST_CORE: ${{ github.workspace }}/core-contract
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          TMPDIR="$(mktemp -d "${GITHUB_WORKSPACE:?}/.t.XXXXXX")"
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          python -m unittest discover -s tests -v
