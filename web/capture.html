<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Time Machine · Orbis Sentinel</title>
    <link rel="stylesheet" href="/sentinel/capture-assets/capture.css">
    <script type="module" src="/sentinel/capture-assets/capture.js"></script>
  </head>
  <body>
    <main aria-labelledby="capture-title" data-mode="waiting" data-phase="preparing">
      <div class="space" aria-hidden="true"><div class="stars"></div><div class="travel"></div></div>
      <section class="capture">
        <div class="capture-scene" aria-hidden="true">
          <div class="capture-deck"><i></i><i></i><i></i></div>
          <div class="boot-lights"><i></i></div>
        </div>
        <h1 id="capture-title">Capturing Orbis</h1>
        <p class="stage" role="status">Waiting for the server to respond.</p>
        <div class="capture-progress">
          <progress max="100" aria-label="Capture progress" hidden></progress>
          <div class="scan" aria-hidden="true" hidden></div>
          <p class="counts" aria-live="off" hidden></p>
        </div>
        <p class="notice">This page will update automatically.</p>
      </section>
      <footer>Orbis Sentinel</footer>
    </main>
  </body>
</html>
